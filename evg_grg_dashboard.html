<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>EVG Approved GRG Bookings</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>

/* ========================================
   RESET & CSS VARIABLES
   ======================================== */

*, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #F5F4F0;
    --surface: #FFFFFF;
    --border: rgba(0,0,0,.09);
    --text: #1A1916;
    --muted: #6B6A66;
    --faint: #A09F9C;
    --accent: #1B5E3B;

    --approved: #F5FBF0;
    --approved-border: #639922;

    --pending: #FFF4E5;
    --pending-border: #E39A32;

    --radius: 14px;

    --grg-bg: #EAF3DE;
    --grg-text: #27500A;
    --grg-border: #639922;
}


/* ========================================
   BODY & TYPOGRAPHY
   ======================================== */

body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 40px;
    -webkit-font-smoothing: antialiased;
}


/* ========================================
   HEADER
   ======================================== */

header {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 14px 18px 12px;
    position: sticky;
    top: 0;
    z-index: 10;
}

.header-link {
    display: block;
    color: inherit;
    text-decoration: none;
}

.header-link:visited,
.header-link:hover,
.header-link:active,
.header-link:focus {
    color: inherit;
    text-decoration: none;
}

.hdr-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
}

.hdr-title {
    font-size: 15px;
    font-weight: 600;
}

.hdr-valid {
    margin-top: 3px;
    font-size: 11px;
    color: var(--faint);
}

.hdr-controls {
    display: flex;
    gap: 8px;
    align-items: center;
}


/* ========================================
   BADGE & BUTTONS
   ======================================== */

.badge {
    background: var(--accent);
    color: #fff;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    white-space: nowrap;
}

.filter-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.2s ease;
}

.filter-btn:hover {
    opacity: 0.9;
}


/* ========================================
   APPROVED / PENDING TOGGLE
   ======================================== */

.status-toggle {
    display: flex;
    gap: 2px;
    background: #E8E7E2;
    padding: 2px;
    border-radius: 999px;
}

.status-btn {
    background: transparent;
    color: var(--muted);
    border: none;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
}

.status-btn.active {
    background: var(--accent);
    color: #fff;
}


/* ========================================
   BOOKING LIST CONTAINER
   ======================================== */

.list {
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}


/* ========================================
   BOOKING CARD
   ======================================== */

.booking-card {
    background: var(--approved);
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--approved-border);
}

.booking-card.pending {
    background: var(--pending);
    border-color: var(--pending-border);
}

.booking-card.hidden {
    display: none;
}


/* ========================================
   CARD HEADER
   ======================================== */

.card-header {
    padding: 10px 14px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    border-bottom: 1px solid var(--border);
}

.card-date {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    font-weight: 500;
}

.card-time {
    margin-top: 3px;
    font-size: 12px;
    color: var(--muted);
}

.card-header-right {
    display: flex;
    gap: 6px;
}


/* ========================================
   TAGS
   ======================================== */

.tag {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    background: var(--accent);
    color: #fff;
    padding: 3px 8px;
    border-radius: 999px;
    white-space: nowrap;
    letter-spacing: .04em;
}

.tag.pending {
    background: var(--pending-border);
    color: #fff;
}

.type-tag {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 999px;
    white-space: nowrap;
}

.type-tag.grg {
    background: var(--grg-bg);
    color: var(--grg-text);
    border: 1px solid var(--grg-border);
}


/* ========================================
   CARD BODY
   ======================================== */

.card-body {
    padding: 12px 14px;
}

.name {
    font-size: 14px;
    font-weight: 600;
}

.comment {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
}


/* ========================================
   STATE MESSAGES
   ======================================== */

.state {
    padding: 80px 24px;
    text-align: center;
}

.state-title {
    font-size: 15px;
    font-weight: 600;
}

.state-sub {
    margin-top: 8px;
    font-size: 13px;
    color: var(--muted);
}


/* ========================================
   LOADING SPINNER
   ======================================== */

.loading {
    min-height: 60vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: var(--muted);
    font-size: 13px;
}

.loading::after {
    content: "";
    display: inline-block;
    width: 14px;
    height: 14px;
    margin-left: 8px;
    vertical-align: -2px;
    border: 2px solid #D8D6D0;
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

</style>
</head>


<body>

<!-- ========================================
     HEADER
     ======================================== -->

<header>

    <div class="hdr-row">

        <div>
            <a href="index.html" class="header-link">

                <div class="hdr-title">
                    EVG GRG Booked
                </div>

                <div class="hdr-valid">
                    My Bookings
                </div>

            </a>
        </div>


        <div class="hdr-controls">

            <div class="status-toggle">

                <button
                    class="status-btn active"
                    id="approvedBtn"
                    type="button">
                    A
                </button>

                <button
                    class="status-btn"
                    id="pendingBtn"
                    type="button">
                    P
                </button>

            </div>


            <button
                class="filter-btn"
                id="sortBtn"
                title="Sort by date"
                type="button">
                📅
            </button>


            <div class="badge" id="count">
<!--                0 bookings-->
                0 🎟️
            </div>

        </div>

    </div>

</header>


<!-- ========================================
     BOOKING LIST
     ======================================== -->

<div class="list" id="bookingList">

    <div class="loading">
        Loading bookings
    </div>

</div>


<script>

/* ========================================
   CONFIGURATION
   ======================================== */

const GAS_DEPLOYMENT_ID =
    "AKfycbxQpeRmvBcWK-Vupw6SYrP4i-b31RdN3Df6IPvWJ7eXFWyUFcmuc3ZwOMVcSkdwnCVYEQ";

const GAS_URL =
    `https://script.google.com/macros/s/${GAS_DEPLOYMENT_ID}/exec`;


/* ========================================
   STATE MANAGEMENT
   ======================================== */

let allBookings = [];

let sortOrder = "asc";

let approvalFilter = "approved";

const userName =
    localStorage.getItem("evg_name") || null;


/* ========================================
   UTILITY: SAFE STRING
   ======================================== */

function safeString(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return "";
    }

    return String(value).trim();

}


/* ========================================
   UTILITY: APPROVAL STATUS
   ======================================== */

function isApproved(booking) {

    return (
        booking.approved === "1" ||
        booking.approved === 1 ||
        booking.approved === true
    );

}


function isPending(booking) {

    return safeString(booking.approved) === "";

}


/* ========================================
   UTILITY: FORMAT DATE
   ======================================== */

function formatDate(value) {

    if (!value) return '';

    const d = new Date(value);

    if (isNaN(d)) {
        return value;
    }

    return d.toLocaleDateString(
        'en-ZA',
        {
            day: '2-digit',
            month: 'short',
            year: 'numeric',
            timeZone: 'Africa/Johannesburg'
        }
    );

}


/* ========================================
   UTILITY: RENDER BOOKING CARDS
   ======================================== */

function renderBookings(bookings) {

    return bookings.map(b => {

        const approved = isApproved(b);

        const statusText =
            approved
                ? "Approved"
                : "Pending";

        const statusClass =
            approved
                ? ""
                : " pending";


        return `
        <div
            class="booking-card${statusClass}"
            data-name="${safeString(b.name)}"
        >

            <div class="card-header">

                <div>

                    <div class="card-date">
                        ${formatDate(b.date)}
                    </div>

                    <div class="card-time">
                        ${safeString(b.day)} · ${safeString(b.timeslot)}
                    </div>

                </div>


                <div class="card-header-right">

                    <span class="tag${statusClass}">
                        ${statusText}
                    </span>

                    <span class="type-tag grg">
                        GRG
                    </span>

                </div>

            </div>


            <div class="card-body">

                <div class="name">
                    ${safeString(b.name)}
                </div>

                ${
                    b.comment
                        ? `<div class="comment">${safeString(b.comment)}</div>`
                        : ""
                }

            </div>

        </div>
        `;

    }).join("");

}


/* ========================================
   UTILITY: UPDATE DISPLAY
   ======================================== */

function updateDisplay() {

    const container =
        document.getElementById("bookingList");


    /*
     * Start with ALL data returned by GAS.
     */

    let bookingsToDisplay =
        allBookings;


    /*
     * Default to the current user's name.
     */

    if (userName) {

        bookingsToDisplay =
            bookingsToDisplay.filter(
                b => safeString(b.name) === userName
            );

    }


    /*
     * Apply Approved / Pending filter.
     */

    if (approvalFilter === "approved") {

        bookingsToDisplay =
            bookingsToDisplay.filter(
                b => isApproved(b)
            );

    } else {

        bookingsToDisplay =
            bookingsToDisplay.filter(
                b => isPending(b)
            );

    }


    /*
     * Nothing found.
     */

    if (bookingsToDisplay.length === 0) {

        const statusText =
            approvalFilter === "approved"
                ? "approved"
                : "pending";


        container.innerHTML = `

            <div class="state">

                <div class="state-title">
                    No ${statusText} bookings found
                </div>

                <div class="state-sub">

                    ${
                        approvalFilter === "approved"
                            ? "Your approved GRG bookings will appear here."
                            : "GRG bookings awaiting approval will appear here."
                    }

                </div>

            </div>

        `;

        updateCount();

        return;
    }


    /*
     * Sort by date.
     */

    const sorted =
        [...bookingsToDisplay].sort(
            (a, b) => {

                const dateA =
                    a.date || "";

                const dateB =
                    b.date || "";

                const cmp =
                    dateA.localeCompare(dateB);

                return sortOrder === "asc"
                    ? cmp
                    : -cmp;

            }
        );


    /*
     * Render.
     */

    container.innerHTML =
        renderBookings(sorted);

    updateCount();

}


/* ========================================
   UTILITY: UPDATE BOOKING COUNT
   ======================================== */

function updateCount() {

    const displayedCards =
        document.querySelectorAll(
            ".booking-card"
        );

    const count =
        displayedCards.length;


    // document.getElementById(
    //     "count"
    // ).textContent =
    //     count +
    //     " booking" +
    //     (count === 1 ? "" : "s");

    document.getElementById(
        "count"
    ).textContent =
        count + " 🎟️";

}


/* ========================================
   APPROVED / PENDING TOGGLE
   ======================================== */

const approvedBtn =
    document.getElementById("approvedBtn");

const pendingBtn =
    document.getElementById("pendingBtn");


approvedBtn.addEventListener(
    "click",
    () => {

        approvalFilter = "approved";

        approvedBtn.classList.add("active");

        pendingBtn.classList.remove("active");

        updateDisplay();

    }
);


pendingBtn.addEventListener(
    "click",
    () => {

        approvalFilter = "pending";

        pendingBtn.classList.add("active");

        approvedBtn.classList.remove("active");

        updateDisplay();

    }
);


/* ========================================
   SORT BUTTON
   ======================================== */

const sortBtn =
    document.getElementById("sortBtn");


sortBtn.addEventListener(
    "click",
    () => {

        sortOrder =
            sortOrder === "asc"
                ? "desc"
                : "asc";


        sortBtn.textContent =
            sortOrder === "asc"
                ? "↑"
                : "↓";


        updateDisplay();

    }
);


/* ========================================
   FETCH & LOAD BOOKINGS
   ======================================== */

function loadApproved() {

    const container =
        document.getElementById(
            "bookingList"
        );


    const startTime =
        performance.now();


    const startTimestamp =
        new Date().toISOString();


    fetch(
        GAS_URL +
        "?action=approvals"
    )


    .then(response => {

        const duration =
            Math.round(
                performance.now() -
                startTime
            );


        localStorage.setItem(
            "evg_dashboard_grg_deployment_call_duration",
            JSON.stringify({

                start:
                    startTimestamp,

                end:
                    new Date().toISOString(),

                duration_ms:
                    duration

            })
        );


        console.log(
            "GRG GAS deployment call duration:",
            duration + "ms"
        );


        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );

        }


        return response.text();

    })


    .then(text => {

        let data;


        try {

            data =
                JSON.parse(text);

        } catch (e) {

            console.error(
                "Non JSON response:",
                text
            );

            throw new Error(
                text.substring(0, 200)
            );

        }


        /*
         * IMPORTANT:
         *
         * Keep ALL returned bookings.
         *
         * We do NOT filter approved bookings
         * here anymore.
         *
         * The Approved / Pending toggle
         * handles the display filtering.
         */

        allBookings =
            (data.approvals || [])
                .map(b => ({

                    ...b,

                    name:
                        safeString(b.name),

                    date:
                        safeString(b.date),

                    day:
                        safeString(b.day),

                    timeslot:
                        safeString(b.timeslot),

                    comment:
                        safeString(b.comment),

                    approved:
                        safeString(b.approved)

                }));


        /*
         * Initial display:
         *
         * Current user
         * Approved bookings
         * Ascending date
         */

        updateDisplay();

    })


    .catch(err => {

        const duration =
            Math.round(
                performance.now() -
                startTime
            );


        localStorage.setItem(
            "evg_dashboard_grg_deployment_call_duration",
            JSON.stringify({

                start:
                    startTimestamp,

                end:
                    new Date().toISOString(),

                duration_ms:
                    duration,

                error:
                    err.message

            })
        );


        container.innerHTML = `

            <div class="state">

                <div class="state-title">
                    Unable to load approvals
                </div>

                <div class="state-sub">
                    ${err.message}
                </div>

            </div>

        `;

    });

}


/* ========================================
   INITIALIZE
   ======================================== */

loadApproved();

</script>

</body>
</html>
